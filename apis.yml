name: Perfios
description: >-
  Perfios is a Bangalore, India-headquartered financial technology (SaaS)
  company providing an AI-driven operating system for banks, NBFCs, fintechs,
  and insurers, serving over 1,000 financial institutions globally. Its platform
  spans four product families: Perfios Analyse (bank statement, ITR, GST,
  payslip, credit-card and financial-statement analysers), Perfios Verify
  (KYC/KYB, video KYC, liveness detection, OCR, digital signature and onboarding
  via OneSDK), Perfios Lens (portfolio monitoring, PFM, credit assessment
  memos, due diligence), and Perfios Protect (document tamper detection,
  deepfake detection, and insurance fraud detection). Perfios also runs a
  digital public infrastructure (DPI) stack for Account Aggregator FIU/FIP roles.
  Its data-aggregation, decisioning, and verification capabilities are delivered
  to partners programmatically; public developer documentation is gated behind
  partner access. Surfaced as a portfolio company of Bessemer Venture Partners.
